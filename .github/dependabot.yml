version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      riverpod:
        patterns:
          - "flutter_riverpod"
          - "riverpod_*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
